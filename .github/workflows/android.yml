# [新增] GitHub Actions：主分支与 PR 上运行 lint、单测、构建并校验 Debug APK
# 加固要点：最小权限、Action 固定 SHA、校验 Wrapper 与实际 APK、产物限时保留
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 防止 Wrapper jar 被替换后执行任意代码
      - name: Verify Gradle wrapper checksum
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' \
            | sha256sum --check

      - name: Run lint and unit tests
        run: ./gradlew --no-daemon --warning-mode all testDebugUnitTest lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # 校验签名与权限，避免产物在未被检查的情况下被分发
      - name: Verify debug APK
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -x "$tools/apksigner" && test -x "$tools/aapt" && test -f "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | head -5
          permissions="$("$tools/aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          printf '%s\n' "$permissions" | python3 -c 'import re,sys; lines=[s.strip() for s in sys.stdin if s.strip().startswith("uses-permission")]; matched=[re.fullmatch(r"uses-permission: name=\x27([^\x27]+)\x27", s) for s in lines]; assert all(matched), "存在无法识别的权限声明"; names=[m.group(1) for m in matched]; assert all(n=="android.permission.INTERNET" or n.startswith("com.example.calculator.") for n in names), "APK 只允许 INTERNET 与应用自身签名权限"'

      - name: Upload lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
